services:
  app:
    image: ${DOCKER_USERNAME}/${DOCKER_REPO}:${DOCKER_TAG:-dev-latest}
    container_name: sololaw-be-spring
    ports:
      - "127.0.0.1:18080:8080"
    # .env의 모든 값을 그대로 컨테이너에 전달한다 — 새 환경변수(비밀키·설정값)를 추가할 때마다 이 파일에
    # 매번 줄을 추가해야 했던 구조라, 추가를 깜빡하면 .env에 값이 있어도 컨테이너는 조용히 빈 값으로 받는
    # 문제가 반복됐다(GEMINI_API_KEY 누락, TOSS_*/STRIPE_* 미연동). .env가 이미 이 앱 하나만을 위한
    # 파일이라 통째로 넘겨도 격리상 손해볼 게 없다.
    env_file:
      - .env
    environment:
      # 도커 네트워크 내부 호스트명 — .env에 없는 값이라 별도로 명시한다
      DB_HOST: postgres
      DB_PORT: 5432
      REDIS_HOST: redis
      REDIS_PORT: 6379
      TZ: Asia/Seoul

      JAVA_OPTS: >-
        -Xms256m -Xmx512m
        -XX:+UseG1GC
        -XX:MaxGCPauseMillis=200
        -Dfile.encoding=UTF-8
        -Duser.timezone=Asia/Seoul
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 120s
    networks:
      - sololaw-network
    restart: unless-stopped
    mem_limit: 1g
    cpus: 1.0
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

networks:
  sololaw-network:
    external: true
